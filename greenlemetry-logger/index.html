<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <!-- Header section -->
    <header class="dash-header"></header>
    <div class="header-brand">
      <span class="brand-logo">🌽</span>
      <h1 class="brand-title">Greenlemetry</h1>
    </div>
    <div class="header-count">
      Bay Count:
      <span id="bay-count" class="bay-total">0</span>
    </div>

    <!-- Main section -->
    <main class="dash-main">
      <!-- Form section -->
      <aside class="form-section">
        <form action="#" class="data-form">
          <h2 class="form-title"></h2>

          <!-- Hidden incorrect input warning -->
          <div
            id="form-error-banner"
            class="alarm alarm-danger hidden"
            role="alarm"
          ></div>

          <div class="form-row">
            <!-- Input 1 -->
            <div class="form-group">
              <label for="bay-number" class="form-label"
                >Bay Number:
                <span class="required">*</span>
              </label>
              <input
                type="number"
                name="bay-number"
                id="bay-number"
                class="form-input"
                placeholder="26"
                required
              />
            </div>
          </div>

          <!-- Inputs 2 & 3 -->
          <div class="form-row">
            <div class="form-group">
              <label for="pH-level" class="form-label"
                >pH Level <span class="required">*</span></label
              >
              <input
                type="number"
                name="pH-level"
                id="pH-level"
                class="form-input"
                min="0"
                max="14"
                step="0.1"
                placeholder="7"
                required
              />
            </div>

            <div class="form-group">
              <label for="conductivity" class="form-label"
                >Electrical Conductivity (mS/cm)
                <span class="required">*</span></label
              >
              <input
                type="number"
                name="conductivity"
                id="conductivity"
                class="form-input"
                min="0"
                max="3"
                step="0.1"
                placeholder="1.5"
                required
              />
            </div>
          </div>

          <!-- Inputs 4 & 5 -->
          <div class="form-row">
            <div class="form-group">
              <label for="air-temp" class="form-label"
                >Air Temperature(F) <span class="required">*</span></label
              >
              <input
                type="number"
                name="air-temp"
                id="air-temp"
                class="form-input"
                min="-50"
                max="125"
                step="0.1"
                placeholder="85"
                required
              />
            </div>

            <div class="form-group">
              <label for="humidity" class="form-label"
                >Relative Humidity (%) <span class="required">*</span></label
              >
              <input
                type="number"
                name="humidity"
                id="humidity"
                class="form-input"
                min="0"
                max="100"
                step="1"
                placeholder="50"
                required
              />
            </div>
          </div>

          <!-- Submit button -->
          <button type="submit" id="form-submit" class="btn btn-primary">
            Record Bay Telemetry
          </button>
        </form>
      </aside>
    </main>
    <footer></footer>
  </body>
</html>

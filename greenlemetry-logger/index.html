<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />

    <!-- Google font family import -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />

    <script src="app.js" defer></script>
  </head>
  <body>
    <!-- Header section -->
    <header class="dash-header">
      <div class="header-brand">
        <span class="brand-logo">🌽</span>
        <h1 class="brand-title">Greenlemetry</h1>
      </div>
      <div class="header-count">
        Bay Count:
        <span id="bay-count" class="bay-total">0</span>
      </div>
    </header>

    <!-- Main section -->
    <main class="dash-main">
      <!-- Form section -->
      <aside class="form-section">
        <form action="#" id="data-form" novalidate>
          <h2 class="form-title">Bay Statistics</h2>

          <!-- Hidden incorrect input warning -->
          <div
            id="form-error-banner"
            class="alarm alarm-danger hidden"
            role="alarm"
          ></div>

          <div class="form-row">
            <!-- Input 1 -->
            <div class="form-group">
              <label for="bay-number" class="form-label"
                >Bay Number:
                <span class="required">*</span>
              </label>
              <input
                type="number"
                name="bay-number"
                id="bay-number"
                class="form-input"
                placeholder="26"
                required
              />
            </div>
          </div>

          <!-- Inputs 2 & 3 -->
          <div class="form-row">
            <div class="form-group">
              <label for="pH-level" class="form-label"
                >pH Level <span class="required">*</span></label
              >
              <input
                type="number"
                name="pH-level"
                id="pH-level"
                class="form-input"
                min="0"
                max="14"
                step="0.1"
                placeholder="7"
                required
              />
            </div>

            <div class="form-group">
              <label for="conductivity" class="form-label"
                >Electrical Conductivity (mS/cm)
                <span class="required">*</span></label
              >
              <input
                type="number"
                name="conductivity"
                id="conductivity"
                class="form-input"
                min="0"
                max="3"
                step="0.1"
                placeholder="1.5"
                required
              />
            </div>
          </div>

          <!-- Inputs 4 & 5 -->
          <div class="form-row">
            <div class="form-group">
              <label for="air-temp" class="form-label"
                >Air Temperature(F) <span class="required">*</span></label
              >
              <input
                type="number"
                name="air-temp"
                id="air-temp"
                class="form-input"
                min="-50"
                max="125"
                step="0.1"
                placeholder="85"
                required
              />
            </div>

            <div class="form-group">
              <label for="humidity" class="form-label"
                >Relative Humidity (%) <span class="required">*</span></label
              >
              <input
                type="number"
                name="humidity"
                id="humidity"
                class="form-input"
                min="0"
                max="100"
                step="1"
                placeholder="50"
                required
              />
            </div>
          </div>

          <!-- Submit button -->
          <button type="submit" id="form-submit" class="btn btn-primary">
            Record Bay Telemetry
          </button>
        </form>
      </aside>

      <!-- Info card section -->
      <section class="info-section">
        <!-- Default empty message -->
        <div class="info-header">
          <h2 class="info-title">Bay Information</h2>
          <button id="Delete-data" class="btn btn-outline btn-danger">
            Delete all
          </button>
        </div>
        <div id="empty-state" class="empty-msg">
          <span class="empty-icon">🪴</span>
          <h3 class="empty-text">No bays recorded.</h3>
        </div>

        <!-- Where info cards will be dynamically added -->
        <ul id="bay-cards" class="bay-grid" aria-live="polite"></ul>
      </section>
    </main>

    <!-- Header section -->
    <footer class="dash-footer">
      <p class="footer-brand">
        &copy; 2026 Telemetry Inc. Designed for CSI 3150.
      </p>
    </footer>
  </body>
</html>
